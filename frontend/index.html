<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay Tuned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Special+Elite&family=Oswald:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Opening scene (intro.js); skip with ?intro=0 -->
  <div class="intro" id="intro">
    <div class="intro-copy">
      <h1>Stay Tuned</h1>
      <p>The only history class with no spoilers</p>
    </div>
    <div class="intro-actions">
      <button class="intro-tune" type="button">Tune in</button>
      <button class="intro-skip" type="button">Skip</button>
    </div>
    <div class="intro-flash"></div>
  </div>
  <!-- Big screen for the TV and the radio -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-box" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <button class="viewer-close" id="viewerClose" type="button" aria-label="Close">✕</button>
      <div class="viewer-set">
        <div class="viewer-screen">
          <video id="viewerVideo" controls playsinline hidden></video>
          <div class="viewer-grille" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <p class="viewer-card" id="viewerCard"></p>
          <span class="viewer-stamp" id="viewerStamp" hidden></span>
        </div>
        <div class="viewer-knobs">
          <button class="knob" id="chanUp" type="button" aria-label="Next channel" title="Next channel (↑)"></button>
          <span class="knob-label" id="chanUpLabel">Channel ▲</span>
          <span class="viewer-dial" id="viewerChannel" aria-live="polite"></span>
          <button class="knob" id="chanDown" type="button" aria-label="Previous channel" title="Previous channel (↓)"></button>
          <span class="knob-label" id="chanDownLabel">Channel ▼</span>
        </div>
      </div>
      <div class="viewer-info">
        <h3 id="viewerTitle"></h3>
        <p id="viewerMeta"></p>
        <audio id="viewerAudio" controls hidden></audio>
        <p class="viewer-empty">No recording on this channel yet.</p>
      </div>
    </div>
  </div>
  <main class="app">
    <section class="scene" id="scene">
      <div class="scene-top">
        <span class="room" id="room">Living room</span>
        <span class="day" id="day">Tuesday, October 16, 1962</span>
      </div>
      <div class="stage" id="stage">
        <!-- The room: tilts slightly with the mouse (fx.js) -->
        <div class="room-layer" id="roomLayer">
          <svg id="art" viewBox="0 0 1600 1000" aria-hidden="true"></svg>
          <img id="photo" alt="" hidden>
          <div id="sprites" aria-hidden="true"></div>
          <div class="glow" id="glow" aria-hidden="true"></div>
          <button class="radio-hit" id="radioHit" type="button" aria-label="Radio" hidden></button>
          <div class="screen static" id="screen" role="button" tabindex="0" aria-label="Television: open the big screen">
            <p id="onAir"></p>
          </div>
        </div>
        <div class="grain" aria-hidden="true"></div>
        <div class="warp-year" id="warpYear" aria-hidden="true"></div>
        <div class="caption" id="caption" aria-live="polite" hidden></div>
      </div>
    </section>

    <aside class="controls">
      <div class="nameplate">
        <span class="brand">Stay Tuned</span>
        <span class="tagline">The only history class with no spoilers</span>
      </div>
      <div class="dial" id="dial"></div>
      <div class="roles" id="roles" role="tablist" aria-label="Rooms"></div>

      <section class="callin">
        <h2>Call the Station</h2>
        <p class="callin-sub">Type, or hold the mic and talk · they only know what was known that day</p>
        <ol class="transcript" id="transcript"></ol>
        <form class="ask" id="askForm">
          <input id="question" autocomplete="off" placeholder="Ask the citizen a question…" required>
          <button type="button" class="mic" id="mic" aria-label="Hold to talk" title="Hold to talk (or hold the space bar)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="submit">Call</button>
        </form>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
